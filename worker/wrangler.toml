name = "rd-care-api-dev"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Preserve dashboard-managed variables, including VAPID_SUBJECT, across GitHub Actions deploys.
# Cloudflare secrets are retained independently; never place private VAPID keys in this file.
keep_vars = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
ALLOWED_ORIGINS = "http://localhost:5500,https://school.example.ac.th"

[[d1_databases]]
binding = "DB"
database_name = "rd-care-dev"
database_id = "161c2fb5-cd80-42bd-bbab-28b5d61df3e0"
migrations_dir = "migrations"

# Keep invocation outcome/CPU diagnostics for 502 investigation.
# Custom import stages log only a gateway request UUID; never student data.
[observability]
enabled = true

[observability.logs]
invocation_logs = true
head_sampling_rate = 1
