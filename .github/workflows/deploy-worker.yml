name: Deploy RD Care Dev Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

concurrency:
  group: rd-care-dev-worker
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Migrate and deploy RD Care Dev
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets before deploying."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Validate Worker and admin APIs
        run: |
          node --check worker/src/worker.js
          node --check worker/src/admin-validation.js
          node --test tests/*.test.mjs

      - name: Ensure dashboard variables are preserved
        shell: bash
        run: |
          if ! grep -Eq '^keep_vars[[:space:]]*=[[:space:]]*true([[:space:]]*(#.*)?)?        working-directory: worker
        run: npx --no-install wrangler d1 migrations apply rd-care-dev --remote

      - name: Deploy RD Care Dev Worker
        working-directory: worker
        run: npx --no-install wrangler deploy

      - name: Verify public health endpoint
        shell: bash
        run: |
          node --input-type=module -e "
            const r=await fetch('https://rd-care-api-dev.yoottana.workers.dev/api/health');
            const body=await r.json();
            if(!r.ok || body.ok!==true || body.service!=='RD Care API')process.exit(1);
            process.stdout.write('RD Care Dev API health OK\\n');
          "
 worker/wrangler.toml; then
            echo "::error::worker/wrangler.toml must set keep_vars = true to preserve dashboard variables such as VAPID_SUBJECT."
            exit 1
          fi

      - name: Apply pending D1 migrations first
        working-directory: worker
        run: npx --no-install wrangler d1 migrations apply rd-care-dev --remote

      - name: Deploy RD Care Dev Worker
        working-directory: worker
        run: npx --no-install wrangler deploy

      - name: Verify public health endpoint
        shell: bash
        run: |
          node --input-type=module -e "
            const r=await fetch('https://rd-care-api-dev.yoottana.workers.dev/api/health');
            const body=await r.json();
            if(!r.ok || body.ok!==true || body.service!=='RD Care API')process.exit(1);
            process.stdout.write('RD Care Dev API health OK\\n');
          "
