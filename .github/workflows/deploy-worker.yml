name: Deploy RD CONNECT Dev Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

concurrency:
  group: rd-care-dev-worker
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Migrate and deploy RD CONNECT Dev
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets before deploying."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Verify QR generator works without external services
        working-directory: worker
        run: |
          node --input-type=module -e "
            const module=await import('qrcode-generator');
            const qr=module.default(0,'M');
            qr.addData('https://rd-care.pages.dev/?late_qr='+'a'.repeat(40));
            qr.make();
            const svg=qr.createSvgTag({cellSize:6,margin:12,scalable:true});
            if(!svg.includes('<svg')||!svg.includes('</svg>'))process.exit(1);
            process.stdout.write('Local QR renderer OK\\n');
          "

      - name: Validate Worker and admin APIs
        run: |
          node --check worker/src/worker.js
          node --check worker/src/admin-validation.js
          node --test tests/*.test.mjs

      - name: Ensure dashboard variables are preserved
        shell: bash
        run: |
          if ! grep -Eq '^[[:space:]]*keep_vars[[:space:]]*=[[:space:]]*true([[:space:]]*#.*)?$' worker/wrangler.toml; then
            echo "::error::worker/wrangler.toml must set keep_vars = true to preserve Cloudflare Dashboard VAPID_SUBJECT."
            exit 1
          fi

      - name: Apply pending D1 migrations first
        working-directory: worker
        run: npx --no-install wrangler d1 migrations apply DB --remote

      - name: Seed room catalog only if this D1 database has no classrooms
        working-directory: worker
        run: npx --no-install wrangler d1 execute DB --remote --file=classrooms_only.sql

      - name: Deploy RD CONNECT Dev Worker
        working-directory: worker
        run: npx --no-install wrangler deploy

      - name: Verify public health endpoint
        shell: bash
        run: |
          node --input-type=module -e "
            const r=await fetch('https://rd-care-api-dev.yoottana.workers.dev/api/health');
            const body=await r.json();
            if(!r.ok || body.ok!==true || body.service!=='RD Care API' || body.brand!=='RD CONNECT')process.exit(1);
            process.stdout.write('RD CONNECT Dev API health OK\\n');
          "
