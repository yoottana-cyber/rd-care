name: Check RD CONNECT
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check worker/src/core.js
          node --check worker/src/password.js
          node --check worker/src/admin-validation.js
          node --check worker/src/student-import.js
          node --check worker/src/unified-roster.js
          node --check worker/src/late-self.js
          node --check worker/src/late-qr.js
          node --check worker/src/late-qr-auto.js
          node --check worker/src/late-qr-push.js
          node --check worker/src/portal.js
          node --check worker/src/portal-bulk-import.js
          node --check worker/src/student-username.js
          node --check worker/src/student-search.js
          node --check worker/src/advisor-import.js
          node --check worker/src/user-password-policy.js
          node --check worker/src/teacher-timetable.js
          node --check worker/src/timetable-audit.js
          node --check worker/src/period-reports.js
          node --check worker/src/staff-push.js
          node --check worker/src/student-affairs.js
          node --check worker/src/school-settings.js
          node --check worker/src/school-terms.js
          node --check worker/src/teacher-score-monitor.js
          node --check worker/src/behavior-bulk.js
          node --check worker/src/adjustment-bulk.js
          node --check worker/src/admin-delete.js
          node --check worker/scripts/generate-vapid.mjs
          node --check worker/src/worker.js
          node --check worker/src/truancy-push.js
          node --check worker/src/web-push-crypto.js
          node --check web/late-gate.js
          node --check web/my-timetable.js
          node --check web/timetable-audit.js
          node --check web/period-center.js
          node --check web/mobile-nav.js
          node --check web/navigation-ui.js
          node --check web/notification-settings.js
          node --check web/pwa-client.js
          node --check web/pwa-updates.js
          node --check web/auth-session.js
          node --check web/admin-settings.js
          node --check web/guardian-push.js
          node --check web/app.js
          node --check web/theme.js
          node --check web/dashboard-charts.js
          node --check web/run-safely.js
          node --check web/request-cache.js
          node --check web/xlsx-reader.js
          node --check web/unified-import.js
          node --check web/advisor-import.js
          node --check web/template-xlsx.js
          node --check web/csv-encoding.js
          node --check web/portal-ui.js
          node --check web/student-affairs.js
          node --check web/score-recording.js
          node --check web/behavior-adjustment.js
          node --check web/score-history.js
          node --check web/score-history-popup.js
          node --check web/teacher-score-monitor.js
          node --check web/school-settings.js
          node --check web/term-snapshots.js
          node --check web/portal-admin.js
          node --check web/portal-roster-import.js
          node --check web/portal-batch.js
          node --check web/sw.js
          node --check web/login-route.js
          node --check web/portal-date-range.js
          node --check 'functions/api/[[path]].js'
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Test schema + sample data
        run: |
          python3 - <<'PY'
          import sqlite3
          c=sqlite3.connect(':memory:')
          with open('worker/migrations/0001_initial.sql',encoding='utf-8') as f: c.executescript(f.read())
          with open('worker/demo_seed.sql',encoding='utf-8') as f: c.executescript(f.read())
          assert c.execute('SELECT count(*) FROM classrooms').fetchone()[0] == 48
          assert c.execute('SELECT count(*) FROM students').fetchone()[0] == 15
          print('D1/SQLite structure and dummy data verified')
          PY
      - name: School settings migration and history constraints
        run: python3 -m unittest discover -s tests -p 'school_settings_migration_test.py' -v
      - name: Semester snapshot FK and historical attendance invariants
        run: python3 -m unittest discover -s tests -p 'term_snapshots_migration_test.py' -v
      - name: Term-aware timetable rebuild, FK and collision triggers
        run: python3 -m unittest discover -s tests -p 'term_timetable_migration_test.py' -v
      - name: Teacher timetable migration and overlap validation
        run: python3 -m unittest discover -s tests -p 'teacher_timetable_migration_test.py' -v
      - name: Truancy edit and Push dispatch regression (real D1 SQL)
        run: python3 -m unittest discover -s tests -p 'truancy_dispatch_selection_test.py' -v
      - name: Urgent truancy alert schema and bounded retry lifecycle
        run: python3 -m unittest discover -s tests -p 'truancy_migration_test.py' -v
      - name: Staff Push subscription migration
        run: python3 -m unittest discover -s tests -p 'staff_push_migration_test.py' -v
      - name: Notification outbox schema and lifecycle
        run: python3 -m unittest discover -s tests -p 'notification_*_test.py' -v
      - name: School-year room transfer plan schema
        run: python3 -m unittest discover -s tests -p 'transfer_*_test.py' -v
      - name: Historical student enrollment invariants
        run: python3 -m unittest discover -s tests -p 'enrollment_*_test.py' -v
      - name: Late self-report SQL lifecycle
        run: python3 -m unittest discover -s tests -p 'late_self_test.py' -v
      - name: QR late Push recipient selection and idempotency
        run: python3 -m unittest discover -s tests -p 'late_qr_push_selection_test.py' -v
      - name: QR late gate and identity constraints
        run: python3 -m unittest discover -s tests -p 'late_qr_migration_test.py' -v
      - name: Portal isolation and guardian relationships
        run: python3 -m unittest discover -s tests -p 'portal_privacy_test.py' -v
      - name: Student affairs schema, reminders and behavior constraints
        run: python3 -m unittest discover -s tests -p 'student_affairs_migration_test.py' -v
      - name: Student and guardian full-roster import SQL and no forced password rotation
        run: python3 -m unittest discover -s tests -p 'portal_account_bulk_migration_test.py' -v
      - name: Account deletion archive migration and FK safety
        run: python3 -m unittest discover -s tests -p 'admin_identity_archive_migration_test.py' -v
